<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0e5c46">
  <title>صفحه پیدا نشد | دعوت‌نامه‌ساز</title>
  <link rel="icon" href="/Event-invitation/icon.svg" type="image/svg+xml">
  <link rel="preload" href="/Event-invitation/assets/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Vazirmatn";
      src: url("/Event-invitation/assets/fonts/Vazirmatn-Regular.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Vazirmatn";
      src: url("/Event-invitation/assets/fonts/Vazirmatn-Bold.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Vazirmatn", system-ui, Tahoma, sans-serif;
      letter-spacing: 0;
      color: #14161b;
      background-color: #f3f1ec;
      background-image: radial-gradient(1200px 600px at 100% -10%, #ffffff 0%, rgba(255, 255, 255, 0) 60%);
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border: 1px solid #e3dfd6;
      border-radius: 20px;
      padding: 32px 26px;
      text-align: center;
      box-shadow: 0 24px 60px -34px rgba(20, 22, 27, .3);
    }
    .code {
      font-size: 56px;
      font-weight: 700;
      color: #0e5c46;
      line-height: 1;
      margin-block-end: 10px;
      direction: ltr;
    }
    h1 { font-size: 19px; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #666c74; font-size: 13.5px; line-height: 1.9; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 11px 22px;
      border-radius: 11px;
      background: #0e5c46;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
    }
    a:hover { background: #0a4433; }
    a:focus-visible { outline: 2.5px solid #0e5c46; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>این صفحه وجود ندارد</h1>
    <p>آدرسی که باز کردید پیدا نشد. برگردید به استودیو و از همان‌جا دعوت‌نامه بسازید.</p>
    <a href="/Event-invitation/">رفتن به دعوت‌نامه‌ساز</a>
  </main>
</body>
</html>
